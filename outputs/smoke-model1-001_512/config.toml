schema_version = 1

[dataset]
harmbench_revision = "8e1604d1171fe8a48d8febecd22f600e462bdcdd"
harmbench_sha256 = "8d81accedd38eaaf8b760618622bb888417d1fd0c86eba65c427a16f1cbb4afc"
xstest_revision = "d7bb5bd738c1fcbc36edd83d5e7d1b71a3e2d84d"
xstest_sha256 = "11783fb294ed017473ee53c207d71f2161c7672c8d0b037501e78387f801cb5a"
categories = ["standard", "contextual"]
labels_path = "data/annotations/severity.csv"
splits_path = "data/splits/splits.json"
seed = 42
# HarmBench: grouped OOF evaluation; each behavior is held out once.
n_folds = 5
# External XSTest safe reference: the same benign fit set is used in every fold.
benign_ratios = [0.6, 0.2, 0.2]

[evaluation]
# Safe test inputs: baseline and the three final vectors, no severity columns.
over_refusal = true

[external]
enabled = true
# Harmful Source=Original rows only; normalized HarmBench overlaps are excluded.
# No external prompt contributes to extraction or configuration selection.
source = "jailbreakbench_original"
revision = "886acc352a31533ffbcf4ef22c744658688086fc"
harmful_sha256 = "4a8ec6832056b631eb092dccc60d37a61c3d441268268888b3d006288afeffa1"
benign_sha256 = "3cda234d21a991fa309bbfea4b6d9dae31ccdf8e9d452424b6a983e4fdc33468"
labels_path = "data/annotations/external_severity.csv"

# Fill these later. A full commit SHA is required for GPU runs.
# ./scripts/pin-models resolves the configured HF IDs to commit SHAs.
# Qwen: 민정, 승민. Qwen2.5 7B-Instruct, pinned checkpoint.
[models.model_1]
hf_id = "Qwen/Qwen2.5-7B-Instruct"
revision = "a09a35458c702b33eeacc393d103063234e8bc28"
dtype = "auto"

# Llama: 재민, 도윤. Exact version/size/checkpoint remains to be selected.
[models.model_2]
hf_id = ""
revision = ""
dtype = "auto"

# Gemma: 세진, 한비. Exact version/size/checkpoint remains to be selected.
[models.model_3]
hf_id = ""
revision = ""
dtype = "auto"

[runtime]
device = "cuda"
max_input_tokens = 4096
max_new_tokens = 512
do_sample = false
seed = 42

[steering]
# Decoder block OUTPUT, last prompt token; -1 means the final decoder block.
# Extraction and intervention use exactly the same block output location.
layers = [-1]
coefficient = 1.0
normalize = false

[judge]
# CPU scoring: ASR_rule is the fraction of responses without a refusal marker.
# On safe questions, over_refusal = 1 - ASR_rule.
method = "rule"
version = "gcg_refusal_v1"
